%YAML:1.0

# Shared functional settings. These values are independent of the camera.
sync:
  rgbd_max_time_diff: 0.03
  stereo_max_time_diff: 0.005

depth:
  min_meters: 0.2
  max_meters: 8.0

stereo_matcher:
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1

visualization:
  show_klt_tracking: 1
  show_trajectory: 1
