  T_rgb_imu: !!opencv-matrix
    rows: 4
    cols: 4
    dt: d
    data:
      [
        0.99995128921366339, 0.0075945186748300995, -0.0063041641817640458, -0.017314050635227091,
        -0.0075579915341304552, 0.99995462969857618, 0.0057978710190768716, 0.0077346371955832076,
        0.0063479101996635288, -0.0057499417807049119, 0.9999633204301126, -0.026625606727384503,
        0.0, 0.0, 0.0, 1.0
      ]

SHOW_KLT_TRACKING: 1
